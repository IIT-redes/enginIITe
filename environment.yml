name: enginiite
channels:
  - conda-forge
dependencies:
  - python=3.9
  - pip
  - pip:
      # Core: power flow, optimisation, data handling
      - pandapower==2.14.6
      - gurobipy==11.0.1      # the version of the reference results; 12.0.3 gives the same costs. Needs a Gurobi licence (academic licences available)
      - numpy==1.26.4
      - pandas==2.2.2
      - scipy==1.13.0
      - openpyxl==3.1.2       # Excel engine used to read networks, profiles and FSP tables
      - pyyaml==6.0.1         # scenario configuration files
      - tqdm==4.66.2
      # Plots and reports
      - matplotlib==3.8.4
      - plotly==5.22.0
